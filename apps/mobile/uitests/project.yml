# A standalone UI test project, deliberately separate from the Capacitor app projects.
#
# Values reach the tests through the SCHEME's environment variables, substituted from the shell by
# XcodeGen when the project is generated. The documented `TEST_RUNNER_<NAME>=value` build setting on
# the xcodebuild command line was tried first and silently does nothing here: nothing with that
# prefix, and no LOOHAR_ variable, arrives in the runner process. Because the tests fell back to a
# default bundle identifier, that failure was invisible — a run asking for a bundle id that is not
# installed still passed. The scheme route is verified by exactly that negative control.
#
# `npx cap add ios` regenerates apps/mobile/<app>/ios from a template, so a test target added there
# would be lost the next time a platform is regenerated. XCUITest can drive any installed app by its
# bundle identifier, so these tests live on their own and attach to whichever Loohar app is asked
# for. The same tests will later drive a physical device.
name: LooharUITests
options:
  bundleIdPrefix: com.loohar.uitests
  deploymentTarget:
    iOS: "15.0"
targets:
  LooharUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LooharUITests
    info:
      path: LooharUITests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.loohar.uitests.runner
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  LooharUITests:
    build:
      targets:
        LooharUITests: [test]
    test:
      targets:
        - LooharUITests
      environmentVariables:
        LOOHAR_APP_BUNDLE_ID: ${LOOHAR_APP_BUNDLE_ID}
        LOOHAR_EMAIL: ${LOOHAR_EMAIL}
        LOOHAR_PASSWORD: ${LOOHAR_PASSWORD}
        LOOHAR_MFA_SECRET: ${LOOHAR_MFA_SECRET}
        LOOHAR_POS_PIN: ${LOOHAR_POS_PIN}
